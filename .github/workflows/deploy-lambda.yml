name: Deploy Lambda

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main   # change if you use a different branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java 17
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      # Step 3: Build server module only
      - name: Build server module
        run: ./server/gradlew clean build

      # Step 4: Deploy to Lambda
      - name: Deploy to AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws lambda update-function-code \
            --function-name register_service \
            --zip-file fileb://server/build/libs/register-service-0.0.1-SNAPSHOT.jar \
            --region $AWS_REGION
